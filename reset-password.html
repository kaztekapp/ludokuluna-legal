<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Reset Password - Ludo Mafia: Board Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1b4c; color: #e0e0e0; line-height: 1.7; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { color: #FFD700; font-size: 1.5em; margin-bottom: 10px; }
        p { color: #c0c0c0; margin-bottom: 20px; }
        .logo { font-size: 3em; margin-bottom: 15px; }
        a { color: #FFD700; text-decoration: none; font-weight: 600; }
        .btn { display: block; padding: 14px 20px; margin: 4px 0 16px; border-radius: 14px; background: #FFD700; color: #0d1b4c; font-size: 1.1em; font-weight: 700; }
        .btn:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
        .hint { font-size: 0.9em; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎲</div>
        <h1 id="title">Ludo Mafia: Board Game</h1>
        <p id="message">To reset your password, open this link on your phone where the Ludo Mafia: Board Game app is installed.<br>Pour réinitialiser votre mot de passe, ouvrez ce lien sur le téléphone où l’application Ludo Mafia est installée.</p>
        <a class="btn" id="openBtn" href="ludo-kuluna://">Open Ludo Mafia</a>
        <p class="hint" id="hint"></p>
    </div>

    <script>
    // The "Forgot password?" email sends people here. Supabase (implicit flow, the
    // app's setting) adds the one-time sign-in to the address:
    //   #access_token=...&refresh_token=...&type=recovery
    // or, when the link is spent: #error=access_denied&error_code=otp_expired&...
    // (a PKCE client would send ?code=... instead). The app only reads query
    // parameters, so this page hands them over as
    //   ludo-kuluna://auth/reset-password?access_token=...&refresh_token=...&type=recovery
    // The token is never logged, stored or sent anywhere: it is kept in this page's
    // memory for the button and wiped from the address bar.
    (function () {
        var APP_LINK = 'ludo-kuluna://auth/reset-password';
        var TEXT = {
            en: {
                button: 'Open Ludo Mafia',
                openTitle: 'Choose a new password',
                openBody: 'Tap the button to open Ludo Mafia and choose your new password.',
                openHint: 'If the app does not open by itself, tap the button.',
                expiredTitle: 'Link expired',
                expiredBody: 'This link has expired or was already used. Request a new one from the app: Forgot password?',
                computerTitle: 'Open on your phone',
                computerBody: 'Open this link on the phone where Ludo Mafia is installed.',
                emptyTitle: 'Reset your password',
                emptyBody: 'Open the link from your password email on the phone where Ludo Mafia is installed.'
            },
            fr: {
                button: 'Ouvrir Ludo Mafia',
                openTitle: 'Choisissez un nouveau mot de passe',
                openBody: 'Touchez le bouton pour ouvrir Ludo Mafia et choisir votre nouveau mot de passe.',
                openHint: 'Si l’application ne s’ouvre pas toute seule, touchez le bouton.',
                expiredTitle: 'Lien expiré',
                expiredBody: 'Ce lien a expiré ou a déjà été utilisé. Demandez-en un nouveau dans l’application : Mot de passe oublié ?',
                computerTitle: 'Ouvrez-le sur votre téléphone',
                computerBody: 'Ouvrez ce lien sur le téléphone où Ludo Mafia est installé.',
                emptyTitle: 'Réinitialiser le mot de passe',
                emptyBody: 'Ouvrez le lien de l’e-mail de mot de passe sur le téléphone où Ludo Mafia est installé.'
            }
        };

        // Query and fragment together; the fragment wins (that is where Supabase puts them).
        function readParams(search, hash) {
            var out = {};
            [search, hash].forEach(function (part) {
                new URLSearchParams((part || '').replace(/^[?#]/, '')).forEach(function (value, key) {
                    if (value) out[key] = value;
                });
            });
            return out;
        }

        // What this address means, and the app link for the button.
        function resetLink(search, hash) {
            var p = readParams(search, hash);
            var q = new URLSearchParams();
            if (p.error || p.error_code || p.error_description) {
                q.set('error', p.error || 'access_denied');
                if (p.error_code) q.set('error_code', p.error_code);
                return { state: 'expired', appUrl: APP_LINK + '?' + q.toString() };
            }
            if (p.access_token) {
                q.set('access_token', p.access_token);
                if (p.refresh_token) q.set('refresh_token', p.refresh_token);
                q.set('type', p.type || 'recovery');
                return { state: 'open', appUrl: APP_LINK + '?' + q.toString() };
            }
            if (p.code) {
                q.set('code', p.code);
                if (p.type) q.set('type', p.type);
                return { state: 'open', appUrl: APP_LINK + '?' + q.toString() };
            }
            return { state: 'empty', appUrl: 'ludo-kuluna://' };
        }

        function onPhone(nav) {
            var ua = nav.userAgent || '';
            return /Android|iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && nav.maxTouchPoints > 1);
        }

        var link = resetLink(window.location.search, window.location.hash);
        if (window.location.search || window.location.hash) {
            window.history.replaceState(null, '', window.location.pathname);
        }

        var lang = String(navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
        var words = TEXT[lang];
        var phone = onPhone(navigator);
        var state = link.state === 'open' && !phone ? 'computer' : link.state;

        document.documentElement.lang = lang;
        document.getElementById('title').textContent = words[state + 'Title'];
        document.getElementById('message').textContent = words[state + 'Body'];
        document.getElementById('hint').textContent = state === 'open' ? words.openHint : '';
        var btn = document.getElementById('openBtn');
        btn.textContent = words.button;
        btn.href = link.appUrl;

        // Try once by itself; browsers often block it, so the button stays.
        if (state === 'open') {
            setTimeout(function () { window.location.href = link.appUrl; }, 600);
        }
    })();
    </script>
</body>
</html>
